<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Dog Walker</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/art/favicon.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/art/favicon-16.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#181425" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Dog Walker" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script src="/nav.js" defer></script>
  </head>
  <body>
    <div
      id="game"
      role="application"
      aria-label="Dog Walker game"
      aria-describedby="game-controls"
    ></div>
    <p id="game-controls" class="visually-hidden">
      Drag across the road or tap either half to switch lanes (keys: arrows, A/D or H/L). Tap a dog
      to give a treat (keys 1 to 3). Tap the pause button in the top bar or press P or Esc to pause,
      and again to resume. Pick a card with 1 to 3.
    </p>
    <div id="dev-panel"></div>
    <div id="update-ready" class="update-toast" role="status" hidden>
      <span>Update ready</span>
      <button type="button">Reload</button>
    </div>
    <div id="turn-upright" class="turn-upright" role="alert" hidden>
      <svg class="turn-upright-phone" viewBox="0 0 12 20" aria-hidden="true">
        <path d="M2 0h8v1h1v1h1v16h-1v1h-1v1H2v-1H1v-1H0V2h1V1h1z" />
        <path class="turn-upright-screen" d="M2 3h8v12H2z" />
        <path class="turn-upright-screen" d="M5 17h2v1H5z" />
      </svg>
      <p>Turn your phone upright</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
