<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Dog Walker</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/art/favicon.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/art/favicon-16.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#181425" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Dog Walker" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script src="/nav.js" defer></script>
  </head>
  <body>
    <div
      id="game"
      role="application"
      aria-label="Dog Walker game"
      aria-describedby="game-controls"
    ></div>
    <p id="game-controls" class="visually-hidden">
      Drag across the road or tap either half to switch lanes (keys: arrows, A/D or H/L). Tap a dog
      to give a treat (keys 1 to 3). Tap the top bar or press P or Esc to pause. Pick a card with 1
      to 3.
    </p>
    <div id="dev-panel"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
