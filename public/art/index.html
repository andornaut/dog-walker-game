<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archie's Dog Walks Art</title>
<link rel="icon" type="image/png" sizes="32x32" href="/art/favicon.png">
<link rel="icon" type="image/png" sizes="16x16" href="/art/favicon-16.png">
<link rel="stylesheet" href="/nav.css">
<script src="/nav.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* A dark viewing room for pixel art: every asset in public/art/manifest.json, grouped by key family and drawn at an integer zoom on a chosen ground colour. */
:root {
  --bg: #13101e;
  --surface: #1d1a2c;
  --raise: #2a2740;
  --fg: #dfe4ee;
  --muted: #8b9bb4;
  --line: #33304a;
  --accent: #feae34;
  --accent-ink: #181425;
  --f-display: "Silkscreen", ui-monospace, monospace;
  --f-body: "Atkinson Hyperlegible", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
/* The filters hide sections, cards and rows whose display rules would otherwise override the attribute. */
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
a { color: var(--accent); }
.wrap {
  max-width: 1240px; margin: 0 auto;
  padding-block: 24px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 28px;
}
header { display: grid; gap: 8px; }
h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(26px, 5vw, 40px); line-height: 1.05; margin: 0; letter-spacing: 0.02em; }
header p { margin: 0; color: var(--muted); max-width: 70ch; }
.counts { display: flex; flex-wrap: wrap; gap: 8px; font-family: var(--f-mono); font-size: 12px; }
button, .jump a {
  min-width: 44px; min-height: 44px; max-width: 100%; padding: 8px 12px;
  border: 1px solid #181425; border-radius: 0; background: #ead4aa; color: #3e2731;
  box-shadow: 0 4px 0 #e4a672, 0 5px 0 #181425;
  font: inherit; cursor: pointer; position: relative; top: 0;
}
button:enabled:active, .jump a:active { top: 2px; box-shadow: 0 2px 0 #e4a672, 0 3px 0 #181425; }
button:disabled, button[aria-pressed="true"]:disabled { background: #a4a4a4; color: #4a4a4a; box-shadow: none; top: 2px; cursor: default; }
button:focus-visible, .jump a:focus-visible { outline: 2px solid #2ce8f5; outline-offset: 3px; }
button[aria-pressed="true"] { background: #fee761; color: #3e2731; box-shadow: inset 0 0 0 1px #feae34, 0 4px 0 #e4a672, 0 5px 0 #181425; font-weight: 600; }
button[aria-pressed="true"]::before { content: "✓ "; content: "✓ " / ""; }

.jump ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.jump a { display: inline-flex; align-items: center; gap: 6px; font-family: var(--f-mono); font-size: 13px; text-decoration: none; }
.jump a small { color: inherit; font-size: 12px; }
.toolbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); border-bottom: 1px solid var(--line);
  display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; padding-block: 10px;
}
.toolbar label, .toolbar .lbl { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; display: flex; gap: 8px; align-items: center; }
.toolbar select, .toolbar input[type="search"] { font: inherit; font-size: 14px; text-transform: none; letter-spacing: 0; background: var(--raise); color: var(--fg); border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px; }
.toolbar input[type="search"] { width: 12em; max-width: 100%; }
/* Ground swatches: native radios, hidden behind their swatch so arrow keys and screen readers work as usual. */
.grounds { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.grounds .lbl { margin-right: 2px; }
.toolbar .gr { display: block; position: relative; cursor: pointer; }
.gr input { position: absolute; inset: 0; margin: 0; opacity: 0; cursor: pointer; }
.gr i { display: block; width: 24px; height: 24px; border-radius: 4px; border: 1px solid var(--line); }
.gr input:checked + i { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent); }
.gr input:focus-visible + i { outline: 2px solid var(--fg); outline-offset: 6px; }
.grounds output { font-size: 13px; color: var(--muted); margin-left: 4px; min-width: 9em; }
@media (max-width: 600px) { .toolbar { gap: 8px 14px; } .toolbar input[type="search"] { width: 9em; } .grounds output { display: none; } }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
section { display: grid; gap: 14px; scroll-margin-top: calc(var(--bar, 56px) + 16px); }
h2 { font-family: var(--f-display); font-weight: 400; font-size: 18px; letter-spacing: 0.06em; margin: 0; text-transform: uppercase; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
h2 small { font-family: var(--f-mono); font-size: 12px; color: var(--muted); letter-spacing: 0; text-transform: none; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; display: grid; grid-template-rows: auto 1fr; min-width: 0; }
.view { display: grid; place-items: center; padding: 16px; min-height: 140px; overflow: auto; }
.view.checker, .gr i.checker { background-color: #c0cbdc; background-image: conic-gradient(#8b9bb4 25%, transparent 0 50%, #8b9bb4 0 75%, transparent 0); background-size: 16px 16px; }
.gr i.checker { background-size: 12px 12px; }
canvas, .view img { display: block; image-rendering: pixelated; image-rendering: crisp-edges; max-width: none; }
.meta { padding: 10px 12px; display: grid; gap: 8px; border-top: 1px solid var(--line); min-width: 0; }
.meta .key, .sound .key { font-family: var(--f-mono); font-weight: 600; font-size: 14px; overflow-wrap: anywhere; }
.meta .dims { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.tags { display: flex; flex-wrap: wrap; gap: 8px; }
.tags button { font-family: var(--f-mono); font-size: 12px; }
.toolbar :focus-visible, .sound audio:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.strip { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 2px; }
.strip canvas { background: rgba(255, 255, 255, 0.04); }
.sounds { display: grid; gap: 8px; }
.sound { display: grid; grid-template-columns: minmax(0, 14em) minmax(0, 420px) auto; grid-template-areas: "key audio loop"; gap: 8px 16px; align-items: center; justify-content: start; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; }
.sound .key { grid-area: key; }
.sound audio { grid-area: audio; display: block; width: 100%; }
.sound .loop { grid-area: loop; font-family: var(--f-mono); font-size: 12px; background: var(--accent); color: var(--accent-ink); font-weight: 600; border-radius: 4px; padding: 2px 8px; }
@media (max-width: 600px) { .sound { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "key loop" "audio audio"; } }
.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 6px; padding: 16px; color: var(--muted); font-size: 14px; }
.empty code { font-family: var(--f-mono); font-size: 13px; color: var(--fg); }
.palette { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 6px; }
.sw { display: grid; gap: 4px; padding: 8px; font-family: var(--f-mono); font-size: 11px; text-align: left; overflow-wrap: anywhere; }
.sw i { display: block; height: 36px; border: 1px solid #181425; }
.sw b { font-weight: 600; }
.error { color: #f6757a; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>
<main class="wrap">
  <header>
    <h1>Archie's Dog Walks Art</h1>
    <p>Every asset listed in <code>/art/manifest.json</code>, as the game loads it, grouped by key prefix. Sprites play their Aseprite animations.</p>
    <div class="counts" id="counts" role="group" aria-label="Show only"></div>
    <p class="error" id="status" hidden></p>
  </header>

  <nav class="jump" aria-label="Asset groups"><ul id="jump"></ul></nav>

  <div class="toolbar" id="toolbar" role="group" aria-label="View options">
    <label for="zoom">Zoom <select id="zoom"><option value="1">1×</option><option value="2">2×</option><option value="3">3×</option><option value="4">4×</option><option value="6">6×</option></select></label>
    <label for="filter">Filter <input id="filter" type="search" placeholder="key, e.g. dog-" autocomplete="off"></label>
    <div class="grounds" role="radiogroup" aria-labelledby="ground-label">
      <span class="lbl" id="ground-label">Ground</span>
      <label class="gr" title="Ink"><input type="radio" name="ground" value="#181425"><i style="background:#181425"></i><span class="sr">Ink</span></label>
      <label class="gr" title="Checker"><input type="radio" name="ground" value="checker"><i class="checker"></i><span class="sr">Checker</span></label>
      <label class="gr" title="Cabbagetown road"><input type="radio" name="ground" value="#8b9bb4"><i style="background:#8b9bb4"></i><span class="sr">Cabbagetown road</span></label>
      <label class="gr" title="High Park road"><input type="radio" name="ground" value="#e4a672"><i style="background:#e4a672"></i><span class="sr">High Park road</span></label>
      <label class="gr" title="Distillery District road"><input type="radio" name="ground" value="#3a4466"><i style="background:#3a4466"></i><span class="sr">Distillery District road</span></label>
      <label class="gr" title="Kensington Market road"><input type="radio" name="ground" value="#5e2620"><i style="background:#5e2620"></i><span class="sr">Kensington Market road</span></label>
      <label class="gr" title="The Beaches road and UI cream"><input type="radio" name="ground" value="#ead4aa"><i style="background:#ead4aa"></i><span class="sr">The Beaches road and UI cream</span></label>
      <label class="gr" title="Yonge Street road"><input type="radio" name="ground" value="#353b45"><i style="background:#353b45"></i><span class="sr">Yonge Street road</span></label>
      <label class="gr" title="High Park verge"><input type="radio" name="ground" value="#1e4d2b"><i style="background:#1e4d2b"></i><span class="sr">High Park verge</span></label>
      <output id="ground-name" aria-hidden="true"></output>
    </div>
  </div>

  <section id="s-palette" aria-labelledby="h-palette"><h2 id="h-palette">Palette <small>Endesga 32, the Toronto colours and the neutral greys</small></h2><div class="palette" id="palette"></div></section>
</main>

<script>
(() => {
"use strict";
const BASE = "/art/";
// The house palette in pixel.py order (Endesga 32, the Toronto colours, the neutral greys), as K name and hex.
const PAL = "rust:be4a2f ochre:d77643 cream:ead4aa tan:e4a672 brown:b86f50 dbrown:733e39 plum:3e2731 dred:a22633 red:e43b44 orange:f77622 amber:feae34 yellow:fee761 green:63c74d dgreen:3e8948 forest:265c42 teal:193c3e blue:124e89 sky:0099db cyan:2ce8f5 white:ffffff lgrey:c0cbdc grey:8b9bb4 slate:5a6988 dslate:3a4466 navy:262b44 ink:181425 hot:ff0044 purple:68386c mauve:b55088 pink:f6757a skin1:e8b796 skin2:c28569 moss:9cb04a olive:6b8a35 dolive:445a26 canopy:357a2f pine:1e4d2b fir:11301c brick:8e3b2b dbrick:5e2620 clay:9a6a4a bark:523a2c walnut:2e2019 driftwood:a99c86 stone:8a857c dstone:625e58 ash:57606a shale:353b45 coal:26292f ttc:da291c turquoise:35c2a6 dturq:1f8a7a lilac:a77bd9 violet:6d4bb0 lime:b2d94a foam:a8e0e6 shallow:58b8c9 lake:2f7fa6 dlake:1d5576 gold:f9c74f peach:ff9e6b haze:cfe3ea azure:3d86e0 cobalt:2654b0 nlgrey:d8d8d8 ngrey:a4a4a4 nslate:727272 ndslate:4a4a4a".split(" ").map(p => p.split(":"));
const $ = id => document.getElementById(id);
const el = (tag, props = {}, kids = []) => {
  const { dataset, ...rest } = props;
  const n = Object.assign(document.createElement(tag), rest);
  if (dataset) Object.assign(n.dataset, dataset);
  for (const k of kids) n.append(k);
  return n;
};

// Gallery sections in page order. Sprites and images go to the first family whose prefix (or exact key) matches,
// and to "road" when none does: road objects use their plain name. Fonts and sounds come from their own manifest lists.
const GROUPS = [
  { id: "dogs", title: "Dogs", prefixes: ["dog-"] },
  { id: "faces", title: "Faces", prefixes: ["face-dog-", "face-owner-", "face-walker-"] },
  { id: "portraits", title: "Portraits", prefixes: ["portrait-"] },
  { id: "walkers", title: "Walkers", prefixes: ["walker-"] },
  { id: "owners", title: "Owners", prefixes: ["owner-"] },
  { id: "road", title: "Road", hint: "no prefix: encounters, lucky finds, forced stops, obstacles, movers, pickups" },
  { id: "ambient", title: "Ambient", prefixes: ["ambient-"] },
  { id: "roadside", title: "Roadside", prefixes: ["roadside-"] },
  { id: "effects", title: "Effects", prefixes: ["fx-"] },
  { id: "cards", title: "Cards", prefixes: ["card-"] },
  { id: "ui", title: "UI", prefixes: ["ui-", "icon-", "item-"] },
  { id: "badges", title: "Badges", prefixes: ["badge-"] },
  { id: "backdrops", title: "Backdrops", prefixes: ["backdrop-"] },
  { id: "road-strips", title: "Road strips", prefixes: ["road-"] },
  { id: "screens", title: "Screens", prefixes: ["screen-"], keys: ["logo"] },
  { id: "fonts", title: "Fonts", list: "fonts" },
  { id: "sounds", title: "Sounds", list: "sounds" },
];
// A depth variant such as dog-kilo@50 groups and sorts with its base key.
const baseKey = key => key.split("@")[0];
const byKey = (x, y) => baseKey(x).localeCompare(baseKey(y)) || x.localeCompare(y);
const familyOf = key => {
  const k = baseKey(key);
  return GROUPS.find(g => g.keys?.includes(k) || g.prefixes?.some(p => k.startsWith(p))) || GROUPS.find(g => g.id === "road");
};

const prefs = { zoom: 3, ground: "#181425" };
try { Object.assign(prefs, JSON.parse(localStorage.getItem("dwg-art-gallery") || "{}")); } catch (e) { /* storage unavailable */ }
const savePrefs = () => { try { localStorage.setItem("dwg-art-gallery", JSON.stringify(prefs)); } catch (e) { /* storage unavailable */ } };
const groundInputs = [...document.querySelectorAll('input[name="ground"]')];
if (!groundInputs.some(i => i.value === prefs.ground)) prefs.ground = groundInputs[0].value;
if (![...$("zoom").options].some(o => Number(o.value) === prefs.zoom)) prefs.zoom = 3;
$("zoom").value = String(prefs.zoom);
groundInputs.forEach(i => { i.checked = i.value === prefs.ground; });
const showGroundName = () => { $("ground-name").textContent = groundInputs.find(i => i.checked).parentElement.title; };
showGroundName();

const loadImage = src => new Promise((ok, fail) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => fail(new Error("Could not load " + src)); i.src = src; });
const getJSON = async url => { const r = await fetch(url, { cache: "no-cache" }); if (!r.ok) throw new Error(`${url}: HTTP ${r.status}`); return r.json(); };
const getText = async url => { const r = await fetch(url, { cache: "no-cache" }); if (!r.ok) throw new Error(`${url}: HTTP ${r.status}`); return r.text(); };

const views = [];      // every .view, so ground changes reach all of them
const scaled = [];     // { canvas, w, h } redrawn on zoom change
const players = [];    // animated sprite players

function applyGround(v) { v.classList.toggle("checker", prefs.ground === "checker"); v.style.backgroundColor = prefs.ground === "checker" ? "" : prefs.ground; }
function makeView() { const v = el("div", { className: "view" }); views.push(v); applyGround(v); return v; }
function sizeCanvas(c, w, h) { c.width = w; c.height = h; c.style.width = w * prefs.zoom + "px"; c.style.height = h * prefs.zoom + "px"; }
function emptyCard(host, text) { host.replaceChildren(el("div", { className: "empty", innerHTML: text })); }
function errorCard(host, kind, key, err) { host.append(el("div", { className: "empty error", textContent: `${key}: ${err.message}`, dataset: { key, kind } })); }

// Aseprite "hash" JSON: frames keyed by name in export order, animations in meta.frameTags.
function sequence(tag) {
  const fwd = []; for (let i = tag.from; i <= tag.to; i++) fwd.push(i);
  if (tag.direction === "reverse") return fwd.reverse();
  if (tag.direction === "pingpong") return fwd.concat(fwd.slice(1, -1).reverse());
  return fwd;
}

async function addSprite(host, s) {
  const [img, data] = await Promise.all([loadImage(BASE + s.png), getJSON(BASE + s.json)]);
  const frames = Object.values(data.frames).map(f => ({ ...f.frame, duration: f.duration || 100 }));
  const tags = data.meta?.frameTags?.length ? data.meta.frameTags : [{ name: "all", from: 0, to: frames.length - 1, direction: "forward" }];
  const fw = Math.max(...frames.map(f => f.w)), fh = Math.max(...frames.map(f => f.h));
  const canvas = el("canvas"); sizeCanvas(canvas, fw, fh); scaled.push({ canvas, w: fw, h: fh });
  const ctx = canvas.getContext("2d");
  const player = { tag: tags[0], seq: sequence(tags[0]), i: 0, t: 0, draw() {
    const f = frames[this.seq[this.i]]; ctx.clearRect(0, 0, fw, fh); ctx.drawImage(img, f.x, f.y, f.w, f.h, 0, 0, f.w, f.h);
  } };
  player.draw(); players.push({ player, frames });

  const tagBar = el("div", { className: "tags" });
  tags.forEach((t, n) => {
    const b = el("button", { type: "button", textContent: `${t.name} (${t.to - t.from + 1})` });
    b.setAttribute("aria-pressed", String(n === 0));
    b.addEventListener("click", () => {
      for (const o of tagBar.children) o.setAttribute("aria-pressed", "false");
      b.setAttribute("aria-pressed", "true");
      Object.assign(player, { tag: t, seq: sequence(t), i: 0, t: 0 }); player.draw();
    });
    tagBar.append(b);
  });
  const strip = el("div", { className: "strip", title: "Every frame in export order" });
  frames.forEach(f => {
    const c = el("canvas"); sizeCanvas(c, f.w, f.h); scaled.push({ canvas: c, w: f.w, h: f.h });
    c.getContext("2d").drawImage(img, f.x, f.y, f.w, f.h, 0, 0, f.w, f.h);
    strip.append(c);
  });
  const view = makeView(); view.append(canvas);
  host.append(el("article", { className: "card", dataset: { key: s.key, kind: "sprites" } }, [view, el("div", { className: "meta" }, [
    el("div", { className: "key", textContent: s.key }),
    el("div", { className: "dims", textContent: `${fw}×${fh} · ${frames.length} frames · ${s.png}` }),
    tagBar, strip,
  ])]));
}

async function addImage(host, s) {
  const img = await loadImage(BASE + s.png);
  const c = el("canvas"); sizeCanvas(c, img.width, img.height); scaled.push({ canvas: c, w: img.width, h: img.height });
  c.getContext("2d").drawImage(img, 0, 0);
  const view = makeView(); view.append(c);
  host.append(el("article", { className: "card", dataset: { key: s.key, kind: "images" } }, [view, el("div", { className: "meta" }, [
    el("div", { className: "key", textContent: s.key }),
    el("div", { className: "dims", textContent: `${img.width}×${img.height} · ${s.png}` }),
  ])]));
}

// XML BMFont, the format Phaser's load.bitmapFont reads.
async function addFont(host, s) {
  const [img, xml] = await Promise.all([loadImage(BASE + s.png), getText(BASE + s.fnt)]);
  const doc = new DOMParser().parseFromString(xml, "application/xml");
  const num = (n, a) => Number(n.getAttribute(a)) || 0;
  const common = doc.querySelector("common"), lineH = common ? num(common, "lineHeight") : 8;
  const chars = new Map([...doc.querySelectorAll("char")].map(c => [num(c, "id"), { x: num(c, "x"), y: num(c, "y"), w: num(c, "width"), h: num(c, "height"), ox: num(c, "xoffset"), oy: num(c, "yoffset"), adv: num(c, "xadvance") }]));
  const lines = ["THE QUICK BROWN FOX", "JUMPS OVER THE LAZY DOG", "the quick brown fox", "0123456789 $42 +1 -2 ♥", "YOU'RE FIRED! TIPS HALVED."];
  const width = Math.max(...lines.map(l => [...l].reduce((w, ch) => w + (chars.get(ch.codePointAt(0))?.adv || 0), 0)));
  const c = el("canvas"); const W = Math.max(1, width), H = lineH * lines.length;
  sizeCanvas(c, W, H);
  const draw = ctx => { lines.forEach((l, row) => { let x = 0; for (const ch of l) { const g = chars.get(ch.codePointAt(0)); if (!g) continue; ctx.drawImage(img, g.x, g.y, g.w, g.h, x + g.ox, row * lineH + g.oy, g.w, g.h); x += g.adv; } }); };
  draw(c.getContext("2d")); scaled.push({ canvas: c, w: W, h: H });
  const missing = [...new Set(lines.join(""))].filter(ch => ch !== " " && !chars.has(ch.codePointAt(0)));
  const view = makeView(); view.append(c);
  host.append(el("article", { className: "card", dataset: { key: s.key, kind: "fonts" } }, [view, el("div", { className: "meta" }, [
    el("div", { className: "key", textContent: s.key }),
    el("div", { className: "dims", textContent: `${chars.size} glyphs · line height ${lineH} · ${s.fnt}` }),
    ...(missing.length ? [el("div", { className: "dims error", textContent: "Missing: " + missing.join(" ") })] : []),
  ])]));
}

// Ogg first, AAC for browsers without Vorbis, as the game loads them. Nothing downloads until play.
async function addSound(host, s) {
  const audio = el("audio", { controls: true, preload: "none", loop: !!s.loop }, [
    el("source", { src: BASE + s.ogg, type: "audio/ogg" }),
    el("source", { src: BASE + s.m4a, type: "audio/mp4" }),
  ]);
  audio.setAttribute("aria-label", s.key);
  host.append(el("div", { className: "sound", dataset: { key: s.key, kind: "sounds" } }, [
    el("div", { className: "key", textContent: s.key }),
    audio,
    ...(s.loop ? [el("span", { className: "loop", textContent: "loop" })] : []),
  ]));
}

// One section per group, inserted before the palette, plus its link in the jump list.
for (const g of GROUPS) {
  const hint = g.hint || [...(g.prefixes || []).map(p => p + "*"), ...(g.keys || [])].join(" ");
  $("s-palette").before(el("section", { id: "s-" + g.id }, [
    el("h2", { id: "h-" + g.id }, [g.title + " ", el("small", { id: "n-" + g.id }), ...(hint ? [el("small", { textContent: hint })] : [])]),
    el("div", { className: g.list === "sounds" ? "sounds" : "grid", id: "g-" + g.id }),
  ]));
  $("s-" + g.id).setAttribute("aria-labelledby", "h-" + g.id);
}
const jumpTargets = [...GROUPS.map(g => [g.id, g.title]), ["palette", "Palette"]];
$("jump").replaceChildren(...jumpTargets.map(([id, title]) => el("li", { id: "j-" + id }, [el("a", { href: "#s-" + id }, [title, el("small", { id: "jn-" + id })])])));
// Keep a jumped-to heading clear of the sticky toolbar, whose height changes as it wraps.
new ResizeObserver(() => document.documentElement.style.setProperty("--bar", $("toolbar").offsetHeight + "px")).observe($("toolbar"));

async function fill(g, items) {
  const host = $("g-" + g.id);
  if (!items.length) { emptyCard(host, `No ${g.title.toLowerCase()} exported yet. Sources go in <code>art/</code>, exports in <code>public/art/</code>, each with an entry in <code>manifest.json</code>.`); return; }
  await Promise.all(items.map(([s, add, kind]) => add(host, s).catch(err => errorCard(host, kind, s.key, err))));
  [...host.children].sort((x, y) => byKey(x.dataset.key || "", y.dataset.key || "")).forEach(c => host.append(c));
}

async function main() {
  let manifest;
  try { manifest = await getJSON(BASE + "manifest.json"); } catch (err) { Object.assign($("status"), { hidden: false, textContent: `Could not read the manifest: ${err.message}` }); manifest = {}; }
  const sprites = manifest.sprites || [], images = manifest.images || [], fonts = manifest.fonts || [], sounds = manifest.sounds || [];
  const counts = { sprites: sprites.length, images: images.length, fonts: fonts.length, sounds: sounds.length };
  for (const b of pills) if (b.dataset.kind in counts) b.textContent = `${counts[b.dataset.kind]} ${b.dataset.kind}`;
  const lists = { fonts: fonts.map(s => [s, addFont, "fonts"]), sounds: sounds.map(s => [s, addSound, "sounds"]) };
  const families = Object.fromEntries(GROUPS.map(g => [g.id, lists[g.list] || []]));
  for (const s of sprites) families[familyOf(s.key).id].push([s, addSprite, "sprites"]);
  for (const s of images) families[familyOf(s.key).id].push([s, addImage, "images"]);
  for (const g of GROUPS) $("g-" + g.id).dataset.total = String(families[g.id].length);
  applyFilter();
  await Promise.all(GROUPS.map(g => fill(g, families[g.id])));
  applyFilter();
}

$("palette").replaceChildren(...PAL.map(([name, h]) => {
  const b = el("button", { type: "button", className: "sw", title: "Copy #" + h }, [el("i", { style: `background:#${h}` }), el("span", { innerHTML: `<b>${name}</b> #${h}` })]);
  b.addEventListener("click", async () => { try { await navigator.clipboard.writeText("#" + h); b.lastChild.innerHTML = `<b>${name}</b> copied`; setTimeout(() => { b.lastChild.innerHTML = `<b>${name}</b> #${h}`; }, 900); } catch (e) { /* clipboard unavailable */ } });
  return b;
}));
$("jn-palette").textContent = String(PAL.length);

// The count pills show one kind at a time: sprites or images keep only those cards, in the groups
// that hold any; fonts, sounds and palette keep their own section. ?show=<kind> holds the
// choice, so it can be linked and survives a reload, and leaves the #hash to the jump links.
const KINDS = ["sprites", "images", "fonts", "sounds", "palette"];
let kind = new URLSearchParams(location.search).get("show");
if (!KINDS.includes(kind)) kind = "";
const pills = [["", "All"], ...KINDS.map(k => [k, k])].map(([k, label]) => {
  const b = el("button", { type: "button", textContent: label, dataset: { kind: k } });
  b.addEventListener("click", () => setKind(b.dataset.kind === kind ? "" : b.dataset.kind));
  return b;
});
pills.find(b => b.dataset.kind === "palette").textContent = `${PAL.length} palette colours`;
$("counts").replaceChildren(...pills);
const markPills = () => pills.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.kind === kind)));
// A #hash naming a section the kind hides is dropped, so a reload doesn't jump to nothing.
function setKind(k) {
  kind = k;
  markPills(); applyFilter();
  const url = new URL(location.href);
  if (k) url.searchParams.set("show", k); else url.searchParams.delete("show");
  if (url.hash && document.getElementById(decodeURIComponent(url.hash.slice(1)))?.hidden) url.hash = "";
  history.replaceState(history.state, "", url);
}

// Hides cards and sound rows that miss the key filter or the kind, and any group (and its jump link) left with none.
// Counts read "shown/total" while a filter hides some of a group.
function applyFilter() {
  const q = $("filter").value.trim().toLowerCase();
  for (const g of GROUPS) {
    const host = $("g-" + g.id), total = Number(host.dataset.total || 0);
    let shown = 0;
    for (const item of host.querySelectorAll("[data-key]")) {
      item.hidden = (!!q && !item.dataset.key.toLowerCase().includes(q)) || (!!kind && item.dataset.kind !== kind);
      if (!item.hidden) shown++;
    }
    $("n-" + g.id).textContent = $("jn-" + g.id).textContent = (q || kind) && shown < total ? `${shown}/${total}` : String(total);
    const ofKind = !kind || (g.list ? kind === g.list : kind === "sprites" || kind === "images");
    $("s-" + g.id).hidden = $("j-" + g.id).hidden = !ofKind || ((!!q || (!!kind && !g.list)) && !shown);
  }
  $("s-palette").hidden = $("j-palette").hidden = !!kind && kind !== "palette";
}
markPills(); applyFilter();
$("filter").addEventListener("input", applyFilter);
for (const i of groundInputs) i.addEventListener("change", () => { prefs.ground = i.value; savePrefs(); showGroundName(); views.forEach(applyGround); });
$("zoom").addEventListener("change", e => {
  prefs.zoom = Number(e.target.value); savePrefs();
  for (const s of scaled) { s.canvas.style.width = s.w * prefs.zoom + "px"; s.canvas.style.height = s.h * prefs.zoom + "px"; }
});

const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
let last = performance.now();
function tick(now) {
  const dt = Math.max(0, now - last); last = now;
  if (!reduced) for (const { player, frames } of players) {
    if (player.seq.length < 2) continue;
    player.t += dt;
    const d = frames[player.seq[player.i]].duration;
    if (player.t >= d) { player.t -= d; player.i = (player.i + 1) % player.seq.length; player.draw(); }
  }
  requestAnimationFrame(tick);
}
main().then(() => requestAnimationFrame(tick));
})();
</script>
</body>
</html>
