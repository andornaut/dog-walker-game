<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Archie's Dog Walks</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/art/favicon.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/art/favicon-16.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#181425" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Archie's Dog Walks" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Link the shared controls directly so the offline precache includes them. -->
    <link rel="stylesheet" href="/controls.css" />
    <link rel="stylesheet" href="/nav.css" />
    <script src="/nav.js" defer></script>
  </head>
  <body>
    <div
      id="game"
      role="application"
      aria-label="Archie's Dog Walks game"
      aria-describedby="game-controls"
    ></div>
    <p id="game-controls" class="visually-hidden">
      Drag across the road or tap either half to switch lanes (keys: arrows, A/D or H/L). Tap the
      pause button in the top bar or press P or Esc to pause, and again to resume. End the walk from
      the pause menu. Pick a card with 1 to 3.
    </p>
    <div id="dev-panel" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
